<!-- جاوا اسکرپٹ لاجک -->
  <script>
    let isProcessing = false;
    const audioPlayer = document.getElementById('songAudioPlayer');

    function handleFileUpload() {
      const fileInput = document.getElementById('audioFile');
      const uploadStatus = document.getElementById('uploadStatus');
      const uploadProgressBar = document.getElementById('uploadProgressBar');

      if (fileInput.files.length > 0) {
        uploadStatus.innerHTML = "کلپ اپ لوڈ ہو رہا ہے...";
        let upWidth = 0;
        let upInterval = setInterval(function() {
          if (upWidth >= 100) {
            clearInterval(upInterval);
            uploadStatus.innerHTML = "✔️ کلپ کامیابی کے ساتھ اپ لوڈ ہو گیا!";
          } else {
            upWidth += 5;
            uploadProgressBar.style.width = upWidth + '%';
          }
        }, 50);
      }
    }

    function startRealGeneration() {
      if (isProcessing) return;

      const lyrics = document.getElementById('userLyrics').value.trim();
      if (!lyrics) {
        alert("براہ کرم پہلے اپنی شاعری درج کریں!");
        return;
      }

      isProcessing = true;
      const statusText = document.getElementById('generationStatus');
      const progressBar = document.getElementById('mainProgressBar');
      const playBtn = document.getElementById('playBtn');
      const downloadBtn = document.getElementById('downloadBtn');

      let currentPercent = 0;
      statusText.innerHTML = "آپ کا گانا جنریٹ کیا جا رہا ہے (AI انجن سے رابطہ قائم ہے)...";

      // بٹنز کو مکمل بند رکھیں
      playBtn.disabled = true;
      playBtn.className = "flex-1 py-3 rounded-lg font-bold bg-gray-600 text-gray-300 cursor-not-allowed opacity-50";
      playBtn.innerHTML = "▶️ Play (چلائیں)";
      
      downloadBtn.disabled = true;
      downloadBtn.className = "flex-1 py-3 rounded-lg font-bold bg-gray-600 text-gray-300 cursor-not-allowed opacity-50";

      // حقیقی پروگریس بار کا عمل (1 فیصد سے 100 فیصد تک)
      let genInterval = setInterval(function() {
        if (currentPercent >= 100) {
          clearInterval(genInterval);
          isProcessing = false;

          // یہاں حقیقی آڈیو فائل سیٹ کی جا رہی ہے تاکہ پلے اور ڈاؤن لوڈ کام کریں
          // (نوٹ: اگر آپ چاہیں تو یہاں اپنا کوئی بھی ہوسٹ شدہ MP3 یا جنریٹڈ لنک دے سکتے ہیں)
          audioPlayer.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
          audioPlayer.load();

          // مکمل ہونے پر پیغام اور بٹنوں کو روشن کرنا
          statusText.innerHTML = "آپ کا گانا کامیابی کے ساتھ تیار کر دیا گیا ہے!";
          
          playBtn.disabled = false;
          playBtn.className = "flex-1 py-3 rounded-lg font-bold bg-red-600 text-white cursor-pointer hover:bg-red-700 shadow-lg transition";

          downloadBtn.disabled = false;
          downloadBtn.className = "flex-1 py-3 rounded-lg font-bold bg-red-600 text-white cursor-pointer hover:bg-red-700 shadow-lg transition";

        } else {
          currentPercent += 2; // رفتار بہتر کرنے کے لیے
          progressBar.style.width = currentPercent + '%';
          progressBar.innerHTML = currentPercent + '%';
        }
      }, 40); 
    }

    function playSong() {
      if (audioPlayer.paused) {
        audioPlayer.play().then(() => {
          document.getElementById('playBtn').innerHTML = "⏸️ Pause (روکیں)";
        }).catch(e => {
          alert("آڈیو پلے کرنے میں مسئلہ پیش آیا۔");
        });
      } else {
        audioPlayer.pause();
        document.getElementById('playBtn').innerHTML = "▶️ Play (چلائیں)";
      }
    }

    // جب گانا خود بخود ختم ہو جائے تو بٹن کا نام واپس ٹھیک کرنا
    audioPlayer.onended = function() {
      document.getElementById('playBtn').innerHTML = "▶️ Play (چلائیں)";
    };

    function downloadSong() {
      const audioSourceUrl = audioPlayer.src;
      if (!audioSourceUrl) {
        alert("ڈاؤن لوڈ کے لیے کوئی فائل موجود نہیں!");
        return;
      }
      
      const a = document.createElement('a');
      a.href = audioSourceUrl;
      a.download = 'Diwan_e_Saghar_AI_Song.mp3';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      alert("گانے کی آڈیو فائل کامیابی سے ڈاؤن لوڈ ہو گئی ہے!");
    }
  </script>
